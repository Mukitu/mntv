<head>

<style>
:root{
  --bg:#050508;--bg2:#0a0a10;--bg3:#101018;--card:#0d0d16;
  --accent:#e11d48;--accent2:#fb7185;--gold:#f59e0b;--gold2:#fde68a;
  --text:#f0f0f6;--muted:#6b6b88;--border:rgba(255,255,255,.055);
  --glow:rgba(225,29,72,.4);--glow2:rgba(245,158,11,.3);
  --header:64px;--cat:50px;
  --radius:14px;--radius-lg:20px;
  --shadow:0 20px 60px rgba(0,0,0,.7);
  --feat-h:180px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}

body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 40% at 15% 0%,rgba(225,29,72,.1),transparent 60%),
    radial-gradient(ellipse 50% 30% at 85% 30%,rgba(99,102,241,.07),transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 100%,rgba(245,158,11,.05),transparent 60%);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.012'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.4}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}

#splash{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,var(--accent),#9f1239);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:40px;color:#fff;box-shadow:0 0 0 1px rgba(225,29,72,.3),0 0 80px var(--glow);animation:logoPulse 2.5s ease-in-out infinite}
@keyframes logoPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 1px rgba(225,29,72,.3),0 0 60px var(--glow)}50%{transform:scale(1.05);box-shadow:0 0 0 1px rgba(225,29,72,.5),0 0 100px var(--glow)}}
.splash-title{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;letter-spacing:6px;background:linear-gradient(90deg,#fff 20%,var(--accent2) 60%,#fff 100%);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}
.splash-sub{color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase}
.splash-bar{width:220px;height:2px;background:rgba(255,255,255,.08);border-radius:1px;overflow:hidden}
.splash-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));animation:loadBar 1.4s ease-in-out infinite}
@keyframes loadBar{0%{width:0;margin-left:0}50%{width:65%;margin-left:15%}100%{width:0;margin-left:100%}}

.header{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--header);background:rgba(5,5,8,.9);border-bottom:1px solid var(--border);backdrop-filter:blur(24px) saturate(1.8);display:flex;align-items:center;gap:14px;padding:0 16px}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.4}
.logo-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.logo-icon{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#9f1239);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:#fff;box-shadow:0 0 0 1px rgba(225,29,72,.3),0 4px 24px var(--glow)}
.logo-text .name{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;letter-spacing:3px;line-height:1;background:linear-gradient(90deg,#fff,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-text .sub{font-size:7px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;display:block}
.header-search{flex:1;max-width:380px;position:relative}
.header-search input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:28px;padding:10px 44px 10px 18px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;transition:.25s}
.header-search input:focus{border-color:rgba(225,29,72,.5);background:rgba(255,255,255,.06);box-shadow:0 0 0 3px rgba(225,29,72,.12),0 0 20px rgba(225,29,72,.08)}
.header-search input::placeholder{color:var(--muted);font-size:13px}
.search-ico{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;opacity:.7}
.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.hbtn{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);cursor:pointer;padding:9px;border-radius:11px;display:flex;transition:.2s}
.hbtn:hover{color:var(--accent2);border-color:rgba(225,29,72,.3);background:rgba(225,29,72,.05)}
.live-pill{background:linear-gradient(135deg,var(--accent),#be123c);color:#fff;font-size:9px;font-weight:700;padding:6px 11px;border-radius:20px;letter-spacing:2px;animation:liveBlink 2.5s infinite;box-shadow:0 0 16px var(--glow)}
@keyframes liveBlink{0%,100%{opacity:1;box-shadow:0 0 16px var(--glow)}50%{opacity:.8;box-shadow:0 0 8px var(--glow)}}

.cat-bar{position:fixed;top:var(--header);left:0;right:0;z-index:199;height:var(--cat);background:rgba(8,8,14,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;padding:0 14px;overflow-x:auto;scrollbar-width:none;backdrop-filter:blur(20px)}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;background:transparent;border:1px solid rgba(255,255,255,.07);color:var(--muted);font-family:inherit;font-weight:600;font-size:11.5px;padding:7px 15px;border-radius:24px;cursor:pointer;transition:.22s;white-space:nowrap;display:flex;align-items:center;gap:5px;letter-spacing:.3px}
.cat-btn.active{background:linear-gradient(135deg,var(--accent),#be123c);color:#fff;border-color:transparent;box-shadow:0 4px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.15)}

.main{position:relative;z-index:1;padding-top:calc(var(--header) + var(--cat) + 18px);padding-bottom:40px;min-height:100vh}
.stats-bar{display:flex;justify-content:center;gap:0;padding:12px 16px 4px;flex-wrap:wrap}
.stat{text-align:center;padding:8px 20px;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-num{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-lbl{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.section-title{padding:18px 16px 10px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:3px;height:14px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px;flex-shrink:0}
.ch-count{font-size:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);padding:3px 10px;border-radius:12px;color:var(--muted);font-family:'Outfit',sans-serif;font-weight:500;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:9px;padding:0 12px 16px}
@media(min-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;padding:0 14px 18px}}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px;padding:0 16px 20px}}
.ch-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px 12px;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden}
.ch-card:hover{transform:translateY(-4px) scale(1.01);border-color:rgba(225,29,72,.3);box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 20px rgba(225,29,72,.1)}
.ch-card:active{transform:scale(.96)}
.ch-logo{width:52px;height:38px;object-fit:contain;border-radius:6px;position:relative;z-index:1}
.ch-ph{width:52px;height:38px;border-radius:6px;background:linear-gradient(135deg,#1a1a28,#0f0f1a);display:none;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:11px;color:var(--accent2);position:relative;z-index:1;border:1px solid rgba(255,255,255,.06)}
.ch-name{font-size:10.5px;font-weight:600;text-align:center;line-height:1.35;width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;position:relative;z-index:1;color:rgba(240,240,246,.85)}
.ch-meta{font-size:9px;color:var(--muted);display:flex;align-items:center;gap:4px;position:relative;z-index:1}
.srv-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5);animation:pulseGreen 2s infinite}
@keyframes pulseGreen{0%,100%{opacity:1}50%{opacity:.5}}
.featured-section{padding:0 12px 8px;margin-bottom:4px}
@media(min-width:480px){.featured-section{padding:0 14px 10px}}
.featured-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:480px){.featured-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}
@media(min-width:768px){.featured-grid{grid-template-columns:repeat(3,1fr);gap:14px}}
.feat-card{background:linear-gradient(145deg,#16100a 0%,#0d0d18 50%,#080810 100%);border:1px solid rgba(245,158,11,.18);border-radius:var(--radius-lg);height:var(--feat-h);cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0;transition:transform .28s,box-shadow .28s}
.feat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--gold) 30%,var(--gold2) 50%,var(--gold) 70%,transparent 100%);opacity:.6}
.feat-card:hover{transform:translateY(-6px) scale(1.01);border-color:rgba(245,158,11,.4);box-shadow:0 24px 60px rgba(0,0,0,.8),0 0 40px rgba(245,158,11,.15)}
.feat-card:active{transform:scale(.97)}
.feat-logo-wrap{position:absolute;top:0;left:0;right:0;bottom:56px;display:flex;align-items:center;justify-content:center;padding:20px}
.feat-logo{width:80px;height:56px;object-fit:contain;filter:drop-shadow(0 4px 16px rgba(0,0,0,.8));position:relative;z-index:1;transition:transform .28s}
.feat-card:hover .feat-logo{transform:scale(1.06)}
.feat-info{position:relative;z-index:2;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.6) 60%,transparent 100%);padding:12px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between}
.feat-name{font-family:'Syne',sans-serif;font-weight:700;font-size:13.5px;color:var(--gold2);line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.feat-badge{background:linear-gradient(135deg,rgba(245,158,11,.25),rgba(245,158,11,.1));border:1px solid rgba(245,158,11,.3);color:var(--gold);font-size:9px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:1.5px;white-space:nowrap}
.feat-srv{font-size:9px;color:rgba(253,230,138,.5);display:flex;align-items:center;gap:3px;margin-top:3px}
.sec-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border) 30%,var(--border) 70%,transparent);margin:4px 16px 2px}
.noresult{padding:80px 24px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
#player{position:fixed;inset:0;z-index:5000;background:#000;display:none;flex-direction:column}
#player.on{display:flex}
#video{width:100%;height:100%;object-fit:contain;background:#000;display:none}
#video.playing{display:block}
#p-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.75);z-index:5;backdrop-filter:blur(4px)}
#p-load.off{display:none}
.p-spin{width:52px;height:52px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.p-load-name{font-size:15px;font-weight:600;color:rgba(255,255,255,.8);font-family:'Syne',sans-serif}
#p-err{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(225,29,72,.95);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;display:none;z-index:6;white-space:nowrap;box-shadow:0 8px 24px var(--glow)}
#p-top{position:absolute;top:0;left:0;right:0;z-index:10;padding:14px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,.4) 50%,transparent 100%);opacity:0;transition:opacity .3s;pointer-events:none}
#player.show-ui #p-top,#player:hover #p-top{opacity:1;pointer-events:all}
#p-back,#p-fs{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);flex-shrink:0;transition:.2s}
#p-back:hover,#p-fs:hover{background:var(--accent);border-color:var(--accent)}
#p-logo{width:36px;height:26px;object-fit:contain;border-radius:5px;flex-shrink:0}
#p-name{flex:1;font-family:'Syne',sans-serif;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#p-servers{display:flex;gap:6px;overflow-x:auto;max-width:50vw;scrollbar-width:none;padding:2px}
#p-servers::-webkit-scrollbar{display:none}
.srv-btn,.quality-btn{flex-shrink:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:10px;font-weight:600;font-family:inherit;transition:.15s;white-space:nowrap}
.srv-btn:hover,.srv-btn.on,.quality-btn:hover,.quality-btn.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--glow)}
#p-bottom{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:20px;display:flex;justify-content:center;gap:14px;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.3) 50%,transparent 100%);opacity:0;transition:opacity .3s;pointer-events:none}
#player.show-ui #p-bottom,#player:hover #p-bottom{opacity:1;pointer-events:all}
.ctrl{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:.2s}
.ctrl:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}
.footer{text-align:center;padding:28px 16px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--border);margin-top:24px}
.footer strong{color:var(--accent2);font-family:'Syne',sans-serif}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(10,10,20,.96);color:var(--text);padding:12px 24px;border-radius:30px;font-size:13px;font-weight:500;z-index:9999;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);opacity:0;transition:.3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.quality-selector{display:flex;gap:6px;margin-left:8px;border-left:1px solid rgba(255,255,255,.2);padding-left:10px}
</style>
</head>
<body>
<div id="splash"><div class="splash-logo">⚽</div><div class="splash-title">MN TV</div><div class="splash-sub">FIFA Worldcup Live Streaming</div><div class="splash-bar"><span></span></div></div>
<header class="header"><a class="logo-wrap" href="#" onclick="return false"><div class="logo-icon">⚽</div><div class="logo-text"><div class="name">CodeCloudBD</div><span class="sub">Live Streaming</span></div></a><div class="header-search"><input type="text" id="search" placeholder="🔍 চ্যানেল খুঁজুন..." autocomplete="off"></div><div class="header-actions"><span class="live-pill">● LIVE</span><button class="hbtn" id="btn-refresh" title="Refresh">⟳</button></div></header>
<div class="cat-bar" id="cat-bar"><button class="cat-btn active" data-cat="all">সব</button><button class="cat-btn" data-cat="Sports">স্পোর্টস</button><button class="cat-btn" data-cat="FIFA World Cup">ফিফা বিশ্বকাপ</button><button class="cat-btn" data-cat="Bangladesh">বাংলাদেশ</button><button class="cat-btn" data-cat="Entertainment">এন্টারটেইনমেন্ট</button><button class="cat-btn" data-cat="News">নিউজ</button><button class="cat-btn" data-cat="Movies">সিনেমা</button><button class="cat-btn" data-cat="Music">মিউজিক</button><button class="cat-btn" data-cat="Cartoon">কার্টুন</button><button class="cat-btn" data-cat="Documentary">ডকুমেন্টারি</button></div>
<main class="main"><div class="stats-bar"><div class="stat"><div class="stat-num" id="totalChannels">0</div><div class="stat-lbl">চ্যানেল</div></div><div class="stat"><div class="stat-num">HD/SD</div><div class="stat-lbl">কোয়ালিটি</div></div><div class="stat"><div class="stat-num">24/7</div><div class="stat-lbl">লাইভ</div></div><div class="stat"><div class="stat-num">FREE</div><div class="stat-lbl">সম্পূর্ণ ফ্রি</div></div></div><div id="search-results" class="hidden"></div><div id="sections"></div><footer class="footer"><strong>MN TV</strong> — FIFA Worldcup Live Streaming<br><span style="font-size:10px;margin-top:6px;display:block;opacity:.7">© 2026 CodeCloudBD. All rights reserved.</span></footer></main>

const FEATURED_IDS = [1,2,6,8,12,14,19,20];
let activeCat="all", currentChIdx=0, currentSrvIdx=0, currentQuality="auto", hls=null, uiTimeout=null;
const splash=document.getElementById("splash"), searchInp=document.getElementById("search"), catBar=document.getElementById("cat-bar"), sectionsDiv=document.getElementById("sections"), searchResDiv=document.getElementById("search-results"), btnRefresh=document.getElementById("btn-refresh"), totalChannelsSpan=document.getElementById("totalChannels"), pWrap=document.getElementById("player"), video=document.getElementById("video"), pLoad=document.getElementById("p-load"), pLoadName=document.getElementById("p-load-name"), pErr=document.getElementById("p-err"), pLogo=document.getElementById("p-logo"), pName=document.getElementById("p-name"), pServers=document.getElementById("p-servers"), qualitySel=document.getElementById("qualitySelector"), pBack=document.getElementById("p-back"), pFs=document.getElementById("p-fs"), pPrev=document.getElementById("p-prev"), pNext=document.getElementById("p-next"), pReload=document.getElementById("p-reload"), toast=document.getElementById("toast");
totalChannelsSpan.textContent=CHANNELS.length;
window.addEventListener("DOMContentLoaded",()=>{setTimeout(()=>splash.classList.add("hide"),1200);renderLayout();initEvents();});
function renderLayout(){sectionsDiv.innerHTML="";if(activeCat==="all"){const featSection=document.createElement("div");featSection.className="featured-section";const featTitle=document.createElement("div");featTitle.className="section-title";featTitle.innerHTML=`🔥 সেরা স্ট্রিম <span class="ch-count">${FEATURED_IDS.length}</span>`;featSection.appendChild(featTitle);const featGrid=document.createElement("div");featGrid.className="featured-grid";FEATURED_IDS.forEach(id=>{const ch=CHANNELS.find(c=>c.id===id);if(ch)featGrid.appendChild(createChannelCard(ch,true));});featSection.appendChild(featGrid);sectionsDiv.appendChild(featSection);const divider=document.createElement("div");divider.className="sec-divider";sectionsDiv.appendChild(divider);const groups={};CHANNELS.forEach(ch=>{if(!groups[ch.category])groups[ch.category]=[];groups[ch.category].push(ch);});for(const cat in groups){renderCategorySection(cat,groups[cat]);}}else{const list=CHANNELS.filter(ch=>ch.category===activeCat);renderCategorySection(activeCat,list);}}
function renderCategorySection(catKey,list){if(!list.length)return;const sect=document.createElement("div");const title=document.createElement("div");title.className="section-title";title.innerHTML=`${catKey} <span class="ch-count">${list.length}</span>`;sect.appendChild(title);const grid=document.createElement("div");grid.className="grid";list.forEach(ch=>grid.appendChild(createChannelCard(ch,false)));sect.appendChild(grid);sectionsDiv.appendChild(sect);}
function createChannelCard(ch,isFeatured){const card=document.createElement("div");if(isFeatured){card.className="feat-card";card.innerHTML=`<div class="feat-logo-wrap"><img class="feat-logo" src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.style.display='none'"><div class="feat-ph">${ch.name.substring(0,2)}</div></div><div class="feat-info"><div><div class="feat-name">${ch.name}</div><div class="feat-srv">⚡ ${ch.servers.length} সার্ভার</div></div><span class="feat-badge">LIVE</span></div>`;}else{card.className="ch-card";card.innerHTML=`<img class="ch-logo" src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="ch-ph">${ch.name.substring(0,2)}</div><div class="ch-name">${ch.name}</div><div class="ch-meta"><span class="srv-dot"></span>${ch.servers.length} সার্ভার</div>`;}card.addEventListener("click",()=>{const idx=CHANNELS.findIndex(c=>c.id===ch.id);playChannel(idx,0);});return card;}
function playChannel(chIdx,srvIdx=0){if(chIdx<0||chIdx>=CHANNELS.length)return;currentChIdx=chIdx;currentSrvIdx=srvIdx;const ch=CHANNELS[chIdx];const server=ch.servers[srvIdx];if(!server)return;destroyPlayer();pWrap.classList.add("on");pLoad.classList.remove("off");pErr.style.display="none";video.classList.remove("playing");pLoadName.textContent=`${ch.name} লোড হচ্ছে...`;pName.textContent=ch.name;pLogo.src=ch.logo;pLogo.onerror=()=>pLogo.style.display='none';renderServerButtons(ch);renderQualityButtons(ch);triggerUi();let streamUrl=server.url;if(currentQuality==="low"&&ch.name==="T Sports"){streamUrl=streamUrl.replace(".m3u8","_low.m3u8");}if(Hls.isSupported()&&streamUrl.includes(".m3u8")){hls=new Hls({maxMaxBufferLength:8,liveSyncDurationCount:2,lowLatencyMode:false,enableWorker:true,backBufferLength:30});hls.loadSource(streamUrl);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(e=>{pLoad.classList.add("off");showToast("▶️ প্লে করতে ট্যাপ করুন");}));hls.on(Hls.Events.ERROR,(event,data)=>{if(data.fatal)handleStreamError();});}else if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=streamUrl;video.addEventListener("loadedmetadata",()=>video.play().catch(e=>{pLoad.classList.add("off");showToast("▶️ প্লে করতে ট্যাপ করুন");}));}else{handleStreamError();}video.onplaying=()=>{pLoad.classList.add("off");video.classList.add("playing");};video.onerror=()=>handleStreamError();}
function renderServerButtons(ch){pServers.innerHTML="";ch.servers.forEach((srv,i)=>{const btn=document.createElement("button");btn.className=`srv-btn ${i===currentSrvIdx?'on':''}`;btn.textContent=srv.label||`S${i+1}`;btn.onclick=(e)=>{e.stopPropagation();playChannel(currentChIdx,i);};pServers.appendChild(btn);});}
function renderQualityButtons(ch){qualitySel.innerHTML="";if(ch.name==="T Sports"){const hdBtn=document.createElement("button");hdBtn.className=`quality-btn ${currentQuality==="auto"?'on':''}`;hdBtn.textContent="HD";hdBtn.onclick=(e)=>{e.stopPropagation();currentQuality="auto";playChannel(currentChIdx,currentSrvIdx);};const sdBtn=document.createElement("button");sdBtn.className=`quality-btn ${currentQuality==="low"?'on':''}`;sdBtn.textContent="SD (স্মুথ)";sdBtn.onclick=(e)=>{e.stopPropagation();currentQuality="low";playChannel(currentChIdx,currentSrvIdx);};qualitySel.appendChild(hdBtn);qualitySel.appendChild(sdBtn);}else{const autoBtn=document.createElement("button");autoBtn.className="quality-btn on";autoBtn.textContent="HD/SD Auto";autoBtn.onclick=(e)=>{e.stopPropagation();showToast("এই চ্যানেলের জন্য স্বয়ংক্রিয় কোয়ালিটি সক্রিয়");};qualitySel.appendChild(autoBtn);}}
function destroyPlayer(){video.pause();video.src="";if(hls){hls.destroy();hls=null;}}
function handleStreamError(){pErr.style.display="block";const ch=CHANNELS[currentChIdx];if(currentSrvIdx+1<ch.servers.length){showToast(`সার্ভার ${currentSrvIdx+1} ব্যর্থ, ${currentSrvIdx+2} নং সার্ভার লোড হচ্ছে...`);setTimeout(()=>playChannel(currentChIdx,currentSrvIdx+1),2000);}else{pLoad.classList.add("off");showToast("সব সার্ভার ব্যর্থ হয়েছে। পরে আবার চেষ্টা করুন।");setTimeout(()=>pErr.style.display="none",3000);}}
function triggerUi(){pWrap.classList.add("show-ui");clearTimeout(uiTimeout);uiTimeout=setTimeout(()=>pWrap.classList.remove("show-ui"),3500);}
function initEvents(){catBar.addEventListener("click",(e)=>{const btn=e.target.closest(".cat-btn");if(!btn)return;document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");activeCat=btn.dataset.cat;renderLayout();});searchInp.addEventListener("input",(e)=>{const val=e.target.value.toLowerCase().trim();if(!val){searchResDiv.classList.add("hidden");sectionsDiv.classList.remove("hidden");return;}sectionsDiv.classList.add("hidden");searchResDiv.classList.remove("hidden");const matches=CHANNELS.filter(ch=>ch.name.toLowerCase().includes(val)||ch.category.toLowerCase().includes(val));if(!matches.length){searchResDiv.innerHTML=`<div class="noresult">😞 কোন চ্যানেল পাওয়া যায়নি!</div>`;return;}searchResDiv.innerHTML=`<div class="section-title">🔍 খোঁজার ফলাফল <span class="ch-count">${matches.length}</span></div>`;const grid=document.createElement("div");grid.className="grid";matches.forEach(ch=>grid.appendChild(createChannelCard(ch,false)));searchResDiv.appendChild(grid);});btnRefresh.addEventListener("click",()=>{showToast("🔄 রিফ্রেশ করা হচ্ছে...");renderLayout();});pBack.onclick=()=>{destroyPlayer();pWrap.classList.remove("on");};pWrap.onclick=()=>triggerUi();pReload.onclick=(e)=>{e.stopPropagation();playChannel(currentChIdx,currentSrvIdx);};pNext.onclick=(e)=>{e.stopPropagation();let next=currentChIdx+1;if(next>=CHANNELS.length)next=0;playChannel(next,0);};pPrev.onclick=(e)=>{e.stopPropagation();let prev=currentChIdx-1;if(prev<0)prev=CHANNELS.length-1;playChannel(prev,0);};pFs.onclick=(e)=>{e.stopPropagation();if(!document.fullscreenElement){pWrap.requestFullscreen().catch(()=>showToast("Fullscreen not supported"));}else{document.exitFullscreen();}};}
function showToast(msg){toast.textContent=msg;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),3000);}
</script>
