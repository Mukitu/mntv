<title>MN TV — Free Live TV Channels | Smooth Streaming</title>
<meta name="description" content="MN TV — বাংলাদেশ, ভারত ও আন্তর্জাতিক লাইভ টিভি চ্যানেল ফ্রিতে দেখুন। স্পোর্টস, নিউজ, এন্টারটেইনমেন্ট।">

<style>
/* ========== GLOBAL RESET & MODERN DESIGN ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none; /* prevents accidental text selection, doesn't affect inputs */
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #050508;
  color: #f0f0f6;
  font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}

/* smooth fonts + preconnect */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap');

:root {
  --bg: #050508;
  --bg2: #0a0a10;
  --card: #0d0d16;
  --accent: #e11d48;
  --accent2: #fb7185;
  --gold: #f59e0b;
  --text: #f0f0f6;
  --muted: #6b6b88;
  --border: rgba(255,255,255,.06);
  --glow: rgba(225,29,72,.3);
  --header: 64px;
  --cat: 50px;
  --radius: 14px;
}

/* ambient background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 70% 40% at 15% 0%, rgba(225,29,72,.1), transparent 60%),
              radial-gradient(ellipse 50% 30% at 85% 30%, rgba(99,102,241,.07), transparent 60%),
              radial-gradient(ellipse 60% 40% at 50% 100%, rgba(245,158,11,.05), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* scrollbar */
::-webkit-scrollbar {
  width: 4px;
  height: 4px;
}
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.15);
  border-radius: 4px;
}

/* SPLASH SCREEN */
#splash {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  transition: opacity .5s, visibility .5s;
}
#splash.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.splash-logo {
  width: 96px;
  height: 96px;
  border-radius: 28px;
  background: linear-gradient(135deg, var(--accent), #9f1239);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 40px;
  box-shadow: 0 0 0 1px rgba(225,29,72,.3), 0 0 60px var(--glow);
  animation: pulseLogo 2s infinite;
}
@keyframes pulseLogo {
  0%,100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.05); opacity: 0.9; }
}
.splash-title {
  font-family: 'Syne', sans-serif;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 4px;
  background: linear-gradient(90deg, #fff, var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.splash-bar {
  width: 200px;
  height: 2px;
  background: rgba(255,255,255,.08);
  border-radius: 2px;
  overflow: hidden;
}
.splash-bar span {
  display: block;
  height: 100%;
  width: 60%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  animation: loadingBar 1.2s ease infinite;
}
@keyframes loadingBar {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}

/* header */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 200;
  height: var(--header);
  background: rgba(5,5,8,.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
}
.logo-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.logo-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #9f1239);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 18px;
}
.logo-text .name {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 2px;
  background: linear-gradient(90deg,#fff, var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-search {
  flex: 1;
  max-width: 320px;
}
.header-search input {
  width: 100%;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 8px 16px;
  color: white;
  font-size: 13px;
  outline: none;
  transition: 0.2s;
}
.header-search input:focus {
  border-color: var(--accent);
  background: rgba(255,255,255,.08);
}
.live-pill {
  background: var(--accent);
  color: white;
  font-size: 9px;
  font-weight: bold;
  padding: 6px 12px;
  border-radius: 30px;
  letter-spacing: 1px;
  box-shadow: 0 0 10px var(--glow);
}

/* categories */
.cat-bar {
  position: fixed;
  top: var(--header);
  left: 0;
  right: 0;
  z-index: 199;
  height: var(--cat);
  background: rgba(8,8,14,.96);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.cat-bar::-webkit-scrollbar { display: none; }
.cat-btn {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid rgba(255,255,255,.08);
  color: var(--muted);
  font-weight: 600;
  font-size: 11px;
  padding: 6px 16px;
  border-radius: 30px;
  cursor: pointer;
  white-space: nowrap;
  transition: 0.2s;
}
.cat-btn.active {
  background: linear-gradient(135deg, var(--accent), #be123c);
  color: white;
  border-color: transparent;
  box-shadow: 0 2px 12px var(--glow);
}
.main {
  padding-top: calc(var(--header) + var(--cat) + 16px);
  padding-bottom: 48px;
  min-height: 100vh;
}

/* sections + grid */
.section-title {
  padding: 16px 16px 8px;
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.ch-count {
  background: rgba(255,255,255,.05);
  border-radius: 30px;
  padding: 2px 10px;
  font-size: 9px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 12px;
  padding: 8px 16px 24px;
}
.ch-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 6px;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.ch-card:hover {
  transform: translateY(-3px);
  border-color: rgba(225,29,72,.4);
  box-shadow: 0 12px 28px rgba(0,0,0,0.5);
}
.ch-logo {
  width: 56px;
  height: 40px;
  object-fit: contain;
  border-radius: 6px;
  background: #fff1;
}
.ch-name {
  font-size: 10px;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ch-meta {
  font-size: 8px;
  color: var(--accent2);
  display: flex;
  gap: 4px;
}
/* featured section */
.featured-section {
  padding: 0 16px 12px;
}
.feat-card {
  background: linear-gradient(145deg, #16100a, #0d0d18);
  border-radius: 18px;
  border: 1px solid rgba(245,158,11,.2);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  transition: 0.2s;
}
.feat-card:hover {
  transform: scale(1.01);
  border-color: var(--gold);
}
.feat-logo {
  width: 56px;
  height: 40px;
  object-fit: contain;
}
.feat-name {
  font-weight: 700;
  font-size: 13px;
  color: var(--gold2);
}
.feat-badge {
  background: rgba(245,158,11,.2);
  padding: 4px 12px;
  border-radius: 24px;
  font-size: 9px;
  font-weight: bold;
}

/* player overlay */
#player {
  position: fixed;
  inset: 0;
  z-index: 5000;
  background: black;
  display: none;
  flex-direction: column;
}
#player.active {
  display: flex;
}
#video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}
.player-controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent);
  padding: 20px;
  display: flex;
  gap: 16px;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
#player:hover .player-controls,
#player.show-ui .player-controls {
  opacity: 1;
  pointer-events: auto;
}
.ctrl-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  width: 44px;
  height: 44px;
  border-radius: 44px;
  color: white;
  font-size: 20px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: 0.2s;
}
.ctrl-btn:hover {
  background: var(--accent);
  transform: scale(1.05);
}
#p-top-info {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transition: 0.2s;
  pointer-events: none;
}
#player:hover #p-top-info,
#player.show-ui #p-top-info {
  opacity: 1;
  pointer-events: auto;
}
#p-back {
  background: rgba(0,0,0,0.5);
  border: none;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 36px;
  cursor: pointer;
}
#p-logo-sm {
  width: 32px;
  height: 28px;
  object-fit: contain;
  background: white;
  border-radius: 6px;
}
#p-name-sm {
  font-weight: bold;
  flex: 1;
}
#p-servers {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  max-width: 50%;
  scrollbar-width: thin;
}
.srv-pill {
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 11px;
  white-space: nowrap;
  cursor: pointer;
  transition: 0.1s;
}
.srv-pill.active {
  background: var(--accent);
}
.loading-spinner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  border: 3px solid rgba(255,255,255,0.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: none;
}
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a2e;
  color: white;
  padding: 8px 20px;
  border-radius: 30px;
  font-size: 12px;
  z-index: 10000;
  opacity: 0;
  transition: 0.2s;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(-10px);
}
footer {
  text-align: center;
  padding: 24px;
  color: var(--muted);
  font-size: 10px;
  border-top: 1px solid var(--border);
  margin-top: 16px;
}
.hidden { display: none !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
// ---------- CHANNEL DATABASE (CLEAN, WORKING LINKS, REMOVED DEAD ONES) ----------
const CHANNELS = [
  { id:1, name:"FIFA World Cup", logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHuaircOKYwteGmj-uy1yC97kHdBGrAhUMndG1u-_96IhLt_Z0kJukkSs&s=10", servers:[{label:"Server 1",url:"https://a62dad94.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWV1X0ZJRkFQbHVzRW5nbGlzaF9ITFM/playlist.m3u8"}], category:"sports" },

  { id:8, name:"Peace TV Bangla", logo:"https://s3.aynaott.com/storage/e33b23f7dc3d39008d672952c33069d4", servers:[{label:"Stream",url:"https://tvsen7.aynaott.com/PeaceTvBanglaHD/index.m3u8?e=1780017865&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=2fd445c1f5d37feecd3df1e02a5c4fb6"}], category:"islamic" },

  { id:11, name:"Independent TV", logo:"https://s3.aynaott.com/storage/6653326503fcade746d87881d5c99697", servers:[{label:"Live",url:"https://tvsen6.aynaott.com/independenttv/index.m3u8?e=1780017865&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=c519b7ed122c51b9b0467292fc0a8b06"}], category:"news" },
  { id:12, name:"Discovery HD", logo:"https://tvassets.roarzone.net/images/discovery_sd.png", servers:[{label:"Discovery",url:"https://xstream.emonsa798.workers.dev/?url=http://premiumtvs.space:8080/live/6388578743/4853784376/406.ts"}], category:"entertainment" },

];

// clean categories map
const CAT_MAP = { all:"সব চ্যানেল", sports:"স্পোর্টস", entertainment:"এন্টারটেইনমেন্ট", news:"নিউজ", islamic:"ইসলামিক", kids:"কিডস" };

let currentCategory = "all";
let currentChannelObj = null;
let hlsInstance = null;
let mpegtsPlayer = null;
let currentServerIdx = 0;
let retryQueue = [];
let proxyActive = false;

// UI elements
const sectionsDiv = document.getElementById("dynamicSections");
const searchInput = document.getElementById("searchInput");
const playerDiv = document.getElementById("player");
const videoEl = document.getElementById("video");
const spinner = document.getElementById("loadSpinner");
const toastEl = document.getElementById("toastMsg");

function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"), 2000); }

// render categories + grid
function renderByCategory(cat, searchTerm = "") {
  let filtered = cat === "all" ? [...CHANNELS] : CHANNELS.filter(ch => ch.category === cat);
  if(searchTerm) filtered = filtered.filter(ch => ch.name.toLowerCase().includes(searchTerm));
  const featured = filtered.slice(0, 3);
  let html = "";
  if(featured.length && !searchTerm) {
    html += `<div class="featured-section"><div class="section-title">✦ ফিচার্ড <span class="ch-count">${featured.length}</span></div>`;
    featured.forEach(ch => {
      html += `<div class="feat-card" data-id="${ch.id}"><img class="feat-logo" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/56x40?text=TV'"><div><div class="feat-name">${ch.name}</div><div class="ch-meta">${ch.servers.length} সার্ভার</div></div><div class="feat-badge">দেখুন</div></div>`;
    });
    html += `</div>`;
  }
  const otherChannels = searchTerm ? filtered : filtered.slice(3);
  if(otherChannels.length) {
    html += `<div class="section-title">${CAT_MAP[cat] || cat} <span class="ch-count">${otherChannels.length}</span></div><div class="grid" id="channelGrid">`;
    otherChannels.forEach(ch => {
      html += `<div class="ch-card" data-id="${ch.id}"><img class="ch-logo" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/56x40?text=TV'"><div class="ch-name">${ch.name}</div><div class="ch-meta">● LIVE</div></div>`;
    });
    html += `</div>`;
  } else if(!featured.length && !otherChannels.length) html = `<div class="section-title">কোন চ্যানেল খুঁজে পাওয়া যায়নি</div>`;
  sectionsDiv.innerHTML = html;
  document.querySelectorAll(".ch-card, .feat-card").forEach(el => {
    el.addEventListener("click", (e) => {
      const id = parseInt(el.dataset.id);
      const channel = CHANNELS.find(c => c.id === id);
      if(channel) openPlayer(channel);
    });
  });
}

// destroy players
function destroyPlayers() {
  if(hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  if(mpegtsPlayer) { mpegtsPlayer.destroy(); mpegtsPlayer = null; }
  videoEl.pause();
  videoEl.removeAttribute("src");
  videoEl.load();
}

// start stream with auto failover
function startStream(url, channel) {
  destroyPlayers();
  spinner.style.display = "block";
  const useProxy = /token=|expire=|roarzone|edge/i.test(url);
  let finalUrl = url;
  if(useProxy && !url.includes("cors")) finalUrl = "https://iptvtest068.emonsa4.workers.dev/?streamUrl=" + encodeURIComponent(url);
  
  const isTs = url.includes(".ts");
  const nativeHls = videoEl.canPlayType("application/vnd.apple.mpegurl");
  
  const onError = () => {
    // failover to next server
    currentServerIdx++;
    if(currentServerIdx < channel.servers.length) {
      toast("সার্ভার পরিবর্তন হচ্ছে...");
      startStream(channel.servers[currentServerIdx].url, channel);
    } else {
      spinner.style.display = "none";
      toast("স্ট্রিম লোড ব্যর্থ, অন্য চ্যানেল চেষ্টা করুন");
    }
  };
  
  if(!isTs && Hls.isSupported()) {
    hlsInstance = new Hls({ enableWorker: true, liveSyncDurationCount: 2, maxBufferLength: 10 });
    hlsInstance.loadSource(finalUrl);
    hlsInstance.attachMedia(videoEl);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { spinner.style.display = "none"; videoEl.play().catch(e=>{}); });
    hlsInstance.on(Hls.Events.ERROR, (evt, data) => { if(data.fatal) onError(); });
  } 
  else if(isTs && typeof mpegts !== "undefined" && mpegts.getFeatureList().mseLivePlayback) {
    mpegtsPlayer = mpegts.createPlayer({ type:"mpegts", isLive:true, url:finalUrl }, { enableWorker:true });
    mpegtsPlayer.attachMediaElement(videoEl);
    mpegtsPlayer.load();
    mpegtsPlayer.on(mpegts.Events.ERROR, onError);
    spinner.style.display = "none";
    videoEl.play().catch(e=>{});
  }
  else if(nativeHls && !isTs) {
    videoEl.src = finalUrl;
    videoEl.onerror = onError;
    spinner.style.display = "none";
    videoEl.play().catch(e=>onError());
  } else {
    onError();
  }
}

function openPlayer(channel) {
  currentChannelObj = channel;
  currentServerIdx = 0;
  // show player UI
  playerDiv.classList.add("active");
  document.body.style.overflow = "hidden";
  document.getElementById("p-name-sm").innerText = channel.name;
  document.getElementById("p-logo-sm").src = channel.logo;
  // render server pills
  const serversDiv = document.getElementById("p-servers");
  serversDiv.innerHTML = "";
  channel.servers.forEach((srv, idx) => {
    const pill = document.createElement("span");
    pill.className = "srv-pill";
    if(idx === currentServerIdx) pill.classList.add("active");
    pill.innerText = srv.label;
    pill.onclick = (e) => {
      e.stopPropagation();
      currentServerIdx = idx;
      startStream(channel.servers[idx].url, channel);
      document.querySelectorAll(".srv-pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      toast(`সার্ভার: ${srv.label}`);
    };
    serversDiv.appendChild(pill);
  });
  startStream(channel.servers[0].url, channel);
  // auto-hide controls after 3s
  clearTimeout(window.uiTimer);
  playerDiv.classList.add("show-ui");
  window.uiTimer = setTimeout(() => playerDiv.classList.remove("show-ui"), 3000);
}

function closePlayer() {
  destroyPlayers();
  playerDiv.classList.remove("active");
  document.body.style.overflow = "";
  currentChannelObj = null;
}

// events & category + search
document.querySelectorAll(".cat-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCategory = btn.dataset.cat;
    renderByCategory(currentCategory, searchInput.value.trim().toLowerCase());
  });
});
searchInput.addEventListener("input", (e) => {
  renderByCategory(currentCategory, e.target.value.trim().toLowerCase());
});
document.getElementById("p-back")?.addEventListener("click", closePlayer);
document.getElementById("p-prev")?.addEventListener("click", () => {
  if(!currentChannelObj) return;
  const idx = CHANNELS.findIndex(c => c.id === currentChannelObj.id);
  const prev = CHANNELS[(idx-1+CHANNELS.length)%CHANNELS.length];
  if(prev) openPlayer(prev);
});
document.getElementById("p-next")?.addEventListener("click", () => {
  if(!currentChannelObj) return;
  const idx = CHANNELS.findIndex(c => c.id === currentChannelObj.id);
  const next = CHANNELS[(idx+1)%CHANNELS.length];
  if(next) openPlayer(next);
});
document.getElementById("p-reload")?.addEventListener("click", () => {
  if(currentChannelObj && currentChannelObj.servers[currentServerIdx]) startStream(currentChannelObj.servers[currentServerIdx].url, currentChannelObj);
});
document.getElementById("p-full")?.addEventListener("click", () => {
  if(playerDiv.requestFullscreen) playerDiv.requestFullscreen();
  else if(playerDiv.webkitRequestFullscreen) playerDiv.webkitRequestFullscreen();
});
// mouse move to show controls
playerDiv.addEventListener("mousemove", () => {
  playerDiv.classList.add("show-ui");
  clearTimeout(window.uiTimer);
  window.uiTimer = setTimeout(() => playerDiv.classList.remove("show-ui"), 3000);
});
videoEl.addEventListener("playing", () => { spinner.style.display = "none"; });
videoEl.addEventListener("waiting", () => { spinner.style.display = "block"; });

// INIT
setTimeout(() => {
  document.getElementById("splash")?.classList.add("hide");
  renderByCategory("all");
}, 1000);
</script>
