<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>MN TV — Watch Free Live TV Channels Online</title>
<meta name="description" content="MN TV — বাংলাদেশ, ভারত ও আন্তর্জাতিক লাইভ টিভি চ্যানেল ফ্রিতে দেখুন। স্পোর্টস, নিউজ, এন্টারটেইনমেন্ট ও আরও অনেক কিছু।">
<meta name="theme-color" content="#0a0a12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
<style>
:root{
  --bg:#050508;--bg2:#0a0a10;--bg3:#101018;--card:#0d0d16;
  --accent:#e11d48;--accent2:#fb7185;--gold:#f59e0b;--gold2:#fde68a;
  --text:#f0f0f6;--muted:#6b6b88;--border:rgba(255,255,255,.055);
  --glow:rgba(225,29,72,.4);--glow2:rgba(245,158,11,.3);
  --header:64px;--cat:50px;
  --radius:14px;--radius-lg:20px;
  --shadow:0 20px 60px rgba(0,0,0,.7);
  --feat-h:180px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}

/* AMBIENT BG */
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 40% at 15% 0%,rgba(225,29,72,.1),transparent 60%),
    radial-gradient(ellipse 50% 30% at 85% 30%,rgba(99,102,241,.07),transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 100%,rgba(245,158,11,.05),transparent 60%);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.012'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.4}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,var(--accent),#9f1239);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:40px;color:#fff;box-shadow:0 0 0 1px rgba(225,29,72,.3),0 0 80px var(--glow);animation:logoPulse 2.5s ease-in-out infinite}
@keyframes logoPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 1px rgba(225,29,72,.3),0 0 60px var(--glow)}50%{transform:scale(1.05);box-shadow:0 0 0 1px rgba(225,29,72,.5),0 0 100px var(--glow)}}
.splash-title{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;letter-spacing:6px;background:linear-gradient(90deg,#fff 20%,var(--accent2) 60%,#fff 100%);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}
.splash-sub{color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase}
.splash-bar{width:220px;height:2px;background:rgba(255,255,255,.08);border-radius:1px;overflow:hidden}
.splash-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));animation:loadBar 1.4s ease-in-out infinite}
@keyframes loadBar{0%{width:0;margin-left:0}50%{width:65%;margin-left:15%}100%{width:0;margin-left:100%}}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--header);background:rgba(5,5,8,.9);border-bottom:1px solid var(--border);backdrop-filter:blur(24px) saturate(1.8);display:flex;align-items:center;gap:14px;padding:0 16px}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.4}
.logo-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.logo-icon{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#9f1239);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:#fff;box-shadow:0 0 0 1px rgba(225,29,72,.3),0 4px 24px var(--glow)}
.logo-text .name{font-family:'Syne',sans-serif;font-weight:800;font-size:21px;letter-spacing:3.5px;line-height:1;background:linear-gradient(90deg,#fff,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-text .sub{font-size:8px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:2px;display:block}
.header-search{flex:1;max-width:380px;position:relative}
.header-search input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:28px;padding:10px 44px 10px 18px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;transition:.25s}
.header-search input:focus{border-color:rgba(225,29,72,.5);background:rgba(255,255,255,.06);box-shadow:0 0 0 3px rgba(225,29,72,.12),0 0 20px rgba(225,29,72,.08)}
.header-search input::placeholder{color:var(--muted);font-size:13px}
.search-ico{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;opacity:.7}
.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.hbtn{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);cursor:pointer;padding:9px;border-radius:11px;display:flex;transition:.2s}
.hbtn:hover{color:var(--accent2);border-color:rgba(225,29,72,.3);background:rgba(225,29,72,.05)}
.live-pill{background:linear-gradient(135deg,var(--accent),#be123c);color:#fff;font-size:9px;font-weight:700;padding:6px 11px;border-radius:20px;letter-spacing:2px;animation:liveBlink 2.5s infinite;box-shadow:0 0 16px var(--glow)}
@keyframes liveBlink{0%,100%{opacity:1;box-shadow:0 0 16px var(--glow)}50%{opacity:.8;box-shadow:0 0 8px var(--glow)}}

/* CATEGORIES */
.cat-bar{position:fixed;top:var(--header);left:0;right:0;z-index:199;height:var(--cat);background:rgba(8,8,14,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;padding:0 14px;overflow-x:auto;scrollbar-width:none;backdrop-filter:blur(20px)}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;background:transparent;border:1px solid rgba(255,255,255,.07);color:var(--muted);font-family:inherit;font-weight:600;font-size:11.5px;padding:7px 15px;border-radius:24px;cursor:pointer;transition:.22s;white-space:nowrap;display:flex;align-items:center;gap:5px;letter-spacing:.3px}
.cat-btn:hover{color:var(--text);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.15)}
.cat-btn.active{background:linear-gradient(135deg,var(--accent),#be123c);color:#fff;border-color:transparent;box-shadow:0 4px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.15)}
.cat-btn svg{width:13px;height:13px;opacity:.85}

/* MAIN */
.main{position:relative;z-index:1;padding-top:calc(var(--header) + var(--cat) + 18px);padding-bottom:40px;min-height:100vh}

/* STATS BAR */
.stats-bar{display:flex;justify-content:center;gap:0;padding:12px 16px 4px;flex-wrap:wrap}
.stat{text-align:center;padding:8px 20px;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-num{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-lbl{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}

/* SECTION TITLES */
.section-title{padding:18px 16px 10px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:3px;height:14px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px;flex-shrink:0}
.ch-count{font-size:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);padding:3px 10px;border-radius:12px;color:var(--muted);font-family:'Outfit',sans-serif;font-weight:500;letter-spacing:0}

/* REGULAR GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:9px;padding:0 12px 16px}
@media(min-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;padding:0 14px 18px}}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px;padding:0 16px 20px}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}}

/* REGULAR CHANNEL CARD */
.ch-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px 12px;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,border-color .22s;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden}
.ch-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.03) 0%,transparent 60%);pointer-events:none}
.ch-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(225,29,72,.08),transparent);opacity:0;transition:opacity .22s}
.ch-card:hover{transform:translateY(-4px) scale(1.01);border-color:rgba(225,29,72,.3);box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 20px rgba(225,29,72,.1)}
.ch-card:hover::after{opacity:1}
.ch-card:active{transform:scale(.96)}
.ch-logo{width:52px;height:38px;object-fit:contain;border-radius:6px;position:relative;z-index:1}
.ch-ph{width:52px;height:38px;border-radius:6px;background:linear-gradient(135deg,#1a1a28,#0f0f1a);display:none;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:11px;color:var(--accent2);position:relative;z-index:1;border:1px solid rgba(255,255,255,.06)}
.ch-name{font-size:10.5px;font-weight:600;text-align:center;line-height:1.35;width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;position:relative;z-index:1;color:rgba(240,240,246,.85)}
.ch-meta{font-size:9px;color:var(--muted);display:flex;align-items:center;gap:4px;position:relative;z-index:1}
.srv-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5)}

/* ✨ FEATURED SECTION — PREMIUM WIDE CARDS */
.featured-section{padding:0 12px 8px;margin-bottom:4px}
@media(min-width:480px){.featured-section{padding:0 14px 10px}}
@media(min-width:768px){.featured-section{padding:0 16px 12px}}
.featured-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:480px){.featured-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}
@media(min-width:768px){.featured-grid{grid-template-columns:repeat(3,1fr);gap:14px}}

.feat-card{background:linear-gradient(145deg,#16100a 0%,#0d0d18 50%,#080810 100%);border:1px solid rgba(245,158,11,.18);border-radius:var(--radius-lg);height:var(--feat-h);cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0;transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s,border-color .28s}
/* Gold shimmer top border */
.feat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--gold) 30%,var(--gold2) 50%,var(--gold) 70%,transparent 100%);opacity:.6;transition:opacity .28s}
/* Glow overlay */
.feat-card::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 120%,rgba(245,158,11,.12),transparent);pointer-events:none;transition:opacity .28s}
.feat-card:hover{transform:translateY(-6px) scale(1.01);border-color:rgba(245,158,11,.4);box-shadow:0 24px 60px rgba(0,0,0,.8),0 0 40px rgba(245,158,11,.15),inset 0 0 30px rgba(245,158,11,.04)}
.feat-card:hover::before{opacity:1}
.feat-card:active{transform:scale(.97)}

/* Logo container with ambient glow */
.feat-logo-wrap{position:absolute;top:0;left:0;right:0;bottom:56px;display:flex;align-items:center;justify-content:center;padding:20px}
.feat-logo-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 50%,rgba(245,158,11,.06),transparent)}
.feat-logo{width:80px;height:56px;object-fit:contain;filter:drop-shadow(0 4px 16px rgba(0,0,0,.8));position:relative;z-index:1;transition:transform .28s}
.feat-card:hover .feat-logo{transform:scale(1.06)}
.feat-ph{width:80px;height:56px;display:none;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--gold);text-shadow:0 0 20px rgba(245,158,11,.5);position:relative;z-index:1}

/* Bottom info bar */
.feat-info{position:relative;z-index:2;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.6) 60%,transparent 100%);padding:12px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between}
.feat-name{font-family:'Syne',sans-serif;font-weight:700;font-size:13.5px;color:var(--gold2);line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.feat-badge{background:linear-gradient(135deg,rgba(245,158,11,.25),rgba(245,158,11,.1));border:1px solid rgba(245,158,11,.3);color:var(--gold);font-size:9px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;backdrop-filter:blur(8px)}
.feat-srv{font-size:9px;color:rgba(253,230,138,.5);display:flex;align-items:center;gap:3px;margin-top:3px}

/* featured section-title override */
.featured-hdr .section-title{color:var(--gold);opacity:.9}
.featured-hdr .section-title::before{background:linear-gradient(180deg,var(--gold),#f59e0b)}
.featured-hdr .ch-count{border-color:rgba(245,158,11,.2);color:rgba(245,158,11,.6);background:rgba(245,158,11,.06)}

/* DIVIDER */
.sec-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border) 30%,var(--border) 70%,transparent);margin:4px 16px 2px}

.noresult{padding:80px 24px;text-align:center;color:var(--muted)}
.noresult svg{width:52px;height:52px;margin-bottom:16px;opacity:.2}
.footer{text-align:center;padding:28px 16px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--border);margin-top:24px;letter-spacing:.5px}
.footer strong{color:var(--accent2);font-family:'Syne',sans-serif;letter-spacing:2px}
.hidden{display:none!important}

/* PLAYER */
#player{position:fixed;inset:0;z-index:5000;background:#000;display:none;flex-direction:column}
#player.on{display:flex}
#video{width:100%;height:100%;object-fit:contain;background:#000;display:none}
#video.playing{display:block}
#p-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.75);z-index:5;backdrop-filter:blur(4px)}
#p-load.off{display:none}
.p-spin{width:52px;height:52px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.p-load-name{font-size:15px;font-weight:600;color:rgba(255,255,255,.8);font-family:'Syne',sans-serif;letter-spacing:1px}
#p-err{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(225,29,72,.95);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;display:none;z-index:6;white-space:nowrap;box-shadow:0 8px 24px var(--glow)}
#p-top{position:absolute;top:0;left:0;right:0;z-index:10;padding:14px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,.4) 50%,transparent 100%);opacity:0;transition:opacity .3s;pointer-events:none}
#player.show-ui #p-top,#player:hover #p-top{opacity:1;pointer-events:all}
#p-back{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);flex-shrink:0;transition:.2s}
#p-back:hover{background:var(--accent);border-color:var(--accent)}
#p-logo{width:36px;height:26px;object-fit:contain;border-radius:5px;flex-shrink:0}
#p-name{flex:1;font-family:'Syne',sans-serif;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#p-servers{display:flex;gap:6px;overflow-x:auto;max-width:55vw;scrollbar-width:none;padding:2px}
#p-servers::-webkit-scrollbar{display:none}
.srv-btn{flex-shrink:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:.15s;white-space:nowrap}
.srv-btn:hover,.srv-btn.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--glow)}
#p-fs{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
#p-fs:hover{background:rgba(255,255,255,.2)}
#p-bottom{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:20px;display:flex;justify-content:center;gap:14px;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.3) 50%,transparent 100%);opacity:0;transition:opacity .3s;pointer-events:none}
#player.show-ui #p-bottom,#player:hover #p-bottom{opacity:1;pointer-events:all}
.ctrl{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:.2s}
.ctrl:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.08);box-shadow:0 0 20px var(--glow)}
.ctrl svg{width:20px;height:20px}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(10,10,20,.96);color:var(--text);padding:12px 24px;border-radius:30px;font-size:13px;font-weight:500;z-index:9999;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(16px);opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">MN</div>
  <div class="splash-title">MN TV</div>
  <div class="splash-sub">Premium Live Streaming</div>
  <div class="splash-bar"><span></span></div>
</div>

<header class="header">
  <a class="logo-wrap" href="#" onclick="return false">
    <div class="logo-icon">MN</div>
    <div class="logo-text">
      <div class="name">MN TV</div>
      <span class="sub">Live Streaming</span>
    </div>
  </a>
  <div class="header-search">
    <input type="text" id="search" placeholder="চ্যানেল খুঁজুন..." autocomplete="off">
    <span class="search-ico"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
  </div>

  const ab = ch.name.split(' ').slice(0,2).map(w=>(w[0]||'')).join('').toUpperCase().slice(0,3);
  const srvTxt = ch.servers.length > 1 ? ch.servers.length+' সার্ভার' : 'লাইভ';
  return `<div class="feat-card" onclick="playCh(${ch.id-1})">
    <div class="feat-logo-wrap">
      <img class="feat-logo" src="${ch.logo}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="feat-ph">${ab}</div>
    </div>
    <div class="feat-info">
      <div>
        <div class="feat-name">${ch.name}</div>
        <div class="feat-srv"><svg width="7" height="7" viewBox="0 0 8 8" fill="#22c55e"><circle cx="4" cy="4" r="4"/></svg> ${srvTxt}</div>
      </div>
      <div class="feat-badge">▶ দেখুন</div>
    </div>
  </div>`;
}

function byCat(cat){ return cat==='all' ? CHANNELS : CHANNELS.filter(c=>c.category===cat); }

function section(cat){
  const chs = byCat(cat);
  if(!chs.length) return '';
  return `<div class="cat-section"><div class="section-title">${CAT_LABELS[cat]||cat} <span class="ch-count">${chs.length}</span></div><div class="grid">${chs.map(card).join('')}</div></div>`;
}

function render(){
  if(curCat==='all'){
    const feat = CHANNELS.filter(c=>isFeatured(c.name));
    const featH = feat.length ? `<div class="featured-hdr"><div class="section-title">✦ ফিচার্ড চ্যানেল <span class="ch-count">${feat.length}</span></div></div><div class="featured-section"><div class="featured-grid">${feat.map(featCard).join('')}</div></div><div class="sec-divider"></div>` : '';
    sections.innerHTML = featH + ['sports','entertainment','news','islamic','kids','others'].map(section).join('');
  } else sections.innerHTML = section(curCat);
}

document.querySelectorAll('.cat-btn').forEach(b=>{
  b.onclick=()=>{
    curCat=b.dataset.cat;
    document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    $('search').value='';
    $('search-results').classList.add('hidden');
    sections.classList.remove('hidden');
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  };
});

$('search').oninput=function(){
  const q=this.value.trim().toLowerCase();
  if(!q){ $('search-results').classList.add('hidden'); sections.classList.remove('hidden'); return; }
  const res=CHANNELS.filter(c=>c.name.toLowerCase().includes(q));
  sections.classList.add('hidden');
  const el=$('search-results');
  el.classList.remove('hidden');
  el.innerHTML = res.length
    ? `<div class="section-title">সার্চ ফলাফল <span class="ch-count">${res.length}</span></div><div class="grid">${res.map(card).join('')}</div>`
    : `<div class="noresult"><svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>"${q}" এর জন্য কোনো চ্যানেল পাওয়া যায়নি</p></div>`;
};

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function showUI(){
  player.classList.add('show-ui');
  clearTimeout(uiT);
  uiT=setTimeout(()=>player.classList.remove('show-ui'),3500);
}

function buildTryQueue(start){
  const srv=CHANNELS[curIdx].servers;
  tryQueue=[]; for(let i=0;i<srv.length;i++) tryQueue.push((start+i)%srv.length);
  tryPos=0; useProxy=true;
}

function isSensitive(url){ return /token=|expire=|roarzone|edge/i.test(url); }
function proxify(url){ return CORS_PROXY + encodeURIComponent(url); }

function setServers(){
  const ch=CHANNELS[curIdx];
  $('p-servers').innerHTML=ch.servers.map((s,i)=>`<button class="srv-btn${i===curSrv?' on':''}" onclick="switchSrv(${i})">${s.label}</button>`).join('');
}

function loadSrv(idx){
  curSrv=idx;
  useProxy=true;
  setServers();
  const url=CHANNELS[curIdx].servers[idx]?.url;
  if(!url){ hideLoad(); return; }
  startStream(url);
}

function failover(){
  const url = CHANNELS[curIdx].servers[curSrv]?.url || '';
  if(useProxy && url){
    useProxy = false;
    toast('ডাইরেক্ট সার্ভার চেষ্টা...');
    startStream(url);
    return;
  }
  useProxy = true;
  tryPos++;
  if(tryPos < tryQueue.length){
    const next = tryQueue[tryPos];
    curSrv = next;
    setServers();
    toast(CHANNELS[curIdx].servers[next].label + ' চেষ্টা...');
    startStream(CHANNELS[curIdx].servers[next].url);
  } else {
    hideLoad();
    $('p-err').style.display='block';
    $('p-err').textContent='⚠️ সব সার্ভার ব্যর্থ — অন্য চ্যানেল চেষ্টা করুন';
    setTimeout(()=>{ $('p-err').style.display='none'; }, 5000);
  }
}

function showLoad(name){
  $('p-load').classList.remove('off');
  $('p-load-name').textContent=name;
  $('p-err').style.display='none';
}

function hideLoad(){ $('p-load').classList.add('off'); }

function destroyPlayer(){
  stopStallWatchdog();
  if(hls){ hls.destroy(); hls=null; }
  if(mpegtsPlayer){ mpegtsPlayer.destroy(); mpegtsPlayer=null; }
  video.pause(); video.removeAttribute('src'); video.load();
  video.classList.remove('playing');
  video.style.display='none';
}

function onStreamPlaying(){
  clearTimeout(loadTimer);
  hideLoad();
  video.classList.add('playing');
  video.style.display='block';
  startStallWatchdog();
}

function armLoadTimeout(){
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => {
    if(curIdx < 0 || video.classList.contains('playing')) return;
    failover();
  }, 14000);
}

// ── stall watchdog ──────────────────────────────────────
let _stallTimer = null, _lastTime = -1, _stallCount = 0;
function startStallWatchdog(){
  clearInterval(_stallTimer);
  _lastTime = -1; _stallCount = 0;
  _stallTimer = setInterval(() => {
    if(curIdx < 0 || !video.classList.contains('playing')) return;
    const t = video.currentTime;
    if(t === _lastTime && !video.paused && !video.ended){
      _stallCount++;
      if(_stallCount >= 2){
        // try resume first
        const p = video.play(); if(p) p.catch(()=>{});
        if(_stallCount >= 4){ clearInterval(_stallTimer); failover(); }
      }
    } else { _stallCount = 0; }
    _lastTime = t;
  }, 3000);
}
function stopStallWatchdog(){ clearInterval(_stallTimer); _stallTimer = null; }

function startStream(rawUrl){
  stopStallWatchdog();
  if(hls){ hls.destroy(); hls=null; }
  if(mpegtsPlayer){ mpegtsPlayer.destroy(); mpegtsPlayer=null; }
  video.pause(); video.removeAttribute('src'); video.load();
  video.classList.remove('playing');
  video.style.display='none';
  showLoad(CHANNELS[curIdx].name);
  $('p-err').style.display='none';
  armLoadTimeout();

  const sens = isSensitive(rawUrl);
  const targetUrl = useProxy ? proxify(rawUrl) : rawUrl;
  let url = targetUrl;
  if(!useProxy && sens && url.includes('?url=')){
    try{ url = new URL(url).searchParams.get('url') || url; }catch(e){}
  }

  const isTS = /\.ts(\?|$|&)/i.test(rawUrl) || rawUrl.toLowerCase().includes('.ts');
  const nativeHls = video.canPlayType('application/vnd.apple.mpegurl');

  const playNative = () => {
    video.src = url;
    video.muted = false;
    video.onerror = () => failover();
    const p = video.play();
    if(p) p.catch(() => failover());
  };

  if(isTS && typeof mpegts !== 'undefined' && mpegts.getFeatureList().mseLivePlayback){
    mpegtsPlayer = mpegts.createPlayer({
      type: 'mpegts', isLive: true, url: url
    }, {
      enableWorker: true,
      enableStashBuffer: true,
      stashInitialSize: 192,
      lazyLoad: false,
      autoCleanupSourceBuffer: true,
      autoCleanupMaxBackwardDuration: 8,
      autoCleanupMinBackwardDuration: 4,
      liveBufferLatencyChasing: true,
      liveBufferLatencyMaxLatency: 3.0,
      liveBufferLatencyMinRemain: 0.3,
      seekType: 'range',
    });
    mpegtsPlayer.attachMediaElement(video);
    mpegtsPlayer.load();
    video.muted = false;
    const mp = mpegtsPlayer.play();
    if(mp) mp.catch(() => {});
    mpegtsPlayer.on(mpegts.Events.ERROR, (et, ed) => {
      if(ed && ed.details && ed.details.type === 'NetworkError') return; // retry internally
      failover();
    });
    return;
  }

  if(typeof Hls !== 'undefined' && Hls.isSupported() && !isTS){
    hls = new Hls({
      enableWorker: true,
      // buffer — small enough for low network, big enough to not re-stall
      maxBufferLength: 8,
      maxMaxBufferLength: 20,
      maxBufferSize: 20 * 1000 * 1000,  // 20MB cap
      maxBufferHole: 0.5,
      // live sync — stay close to live edge
      liveSyncDurationCount: 2,
      liveMaxLatencyDurationCount: 4,
      liveDurationInfinity: true,
      // ABR — start at lowest quality, ramp up fast
      startLevel: 0,
      autoStartLoad: true,
      abrEwmaFastLive: 2,
      abrEwmaSlowLive: 6,
      abrBandWidthFactor: 0.85,
      abrBandWidthUpFactor: 0.65,
      // retries — be patient on bad network
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 800,
      fragLoadingMaxRetryTimeout: 8000,
      manifestLoadingMaxRetry: 5,
      manifestLoadingRetryDelay: 1000,
      levelLoadingMaxRetry: 5,
      levelLoadingRetryDelay: 1000,
      lowLatencyMode: false,
      progressive: true,
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.muted = false;
      const p = video.play();
      if(p) p.catch(() => failover());
    });
    let _mediaRecovered = false;
    hls.on(Hls.Events.ERROR, (ev, data) => {
      if(!data.fatal){
        // non-fatal buffer hole — nudge playback
        if(data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR ||
           data.details === Hls.ErrorDetails.BUFFER_SEEK_OVER_HOLE){
          try{ video.currentTime += 0.1; }catch(e){}
        }
        return;
      }
      if(data.type === Hls.ErrorTypes.MEDIA_ERROR && hls && !_mediaRecovered){
        _mediaRecovered = true;
        hls.recoverMediaError();
        return;
      }
      failover();
    });
    return;
  }

  if(nativeHls && !isTS){ playNative(); return; }
  if(!isTS){ playNative(); return; }
  streamFailed();
}

function streamFailed(){
  hideLoad();
  $('p-err').style.display='block';
  $('p-err').textContent='⚠️ স্ট্রিম লোড হয়নি — অন্য সার্ভার চেষ্টা করুন';
  setTimeout(()=>{ $('p-err').style.display='none'; }, 4000);
}

window.playCh=function(idx){
  curIdx=idx;
  const ch=CHANNELS[idx];
  const saved = parseInt(localStorage.getItem('mntv_srv_'+idx)||'0',10);
  const start = (!isNaN(saved) && saved>=0 && saved<ch.servers.length) ? saved : 0;
  buildTryQueue(start);
  curSrv=tryQueue[0];
  $('p-name').textContent=ch.name;
  $('p-logo').src=ch.logo;
  $('p-logo').onerror=()=>{$('p-logo').style.display='none'};
  player.classList.add('on');
  document.body.style.overflow='hidden';
  setServers();
  loadSrv(curSrv);
  localStorage.setItem('mntv_last',String(idx));
  showUI();
};

window.switchSrv=function(i){
  buildTryQueue(i);
  tryPos = 0;
  curSrv = i;
  loadSrv(i);
  localStorage.setItem('mntv_srv_'+curIdx, String(i));
  toast(CHANNELS[curIdx].servers[i].label);
  showUI();
};

function closePlayer(){
  clearTimeout(loadTimer);
  player.classList.remove('on','show-ui');
  document.body.style.overflow='';
  destroyPlayer();
  hideLoad();
}

$('p-back').onclick=closePlayer;
$('p-reload').onclick=()=>{ if(curIdx>=0) loadSrv(curSrv); };
$('p-prev').onclick=()=>{ if(curIdx>0) playCh(curIdx-1); };
$('p-next').onclick=()=>{ if(curIdx<CHANNELS.length-1) playCh(curIdx+1); };
$('p-fs').onclick=()=>{
  if(!document.fullscreenElement) (player.requestFullscreen||player.webkitRequestFullscreen)?.call(player);
  else (document.exitFullscreen||document.webkitExitFullscreen)?.call(document);
};
$('btn-refresh').onclick=()=>{ toast('রিফ্রেশ...'); setTimeout(()=>location.reload(),500); };

player.addEventListener('touchstart',showUI,{passive:true});
player.addEventListener('mousemove',showUI);
player.addEventListener('click',e=>{ if(!e.target.closest('button')&&!e.target.closest('#p-servers')) showUI(); });
video.addEventListener('waiting',()=>{ if(curIdx>=0) showLoad(CHANNELS[curIdx].name); });
video.addEventListener('playing', onStreamPlaying);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&player.classList.contains('on')) closePlayer(); });

// Init
setTimeout(()=>{
  $('splash').classList.add('hide');
  render();
  const last=parseInt(localStorage.getItem('mntv_last')||'-1',10);
  if(last>=0&&last<CHANNELS.length) toast('স্বাগতম MN TV!');
},1200);
</script>
</body>
