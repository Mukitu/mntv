<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>MN TV — Watch Free Live TV Channels Online</title>
<meta name="description" content="MN TV — বাংলাদেশ, ভারত ও আন্তর্জাতিক লাইভ টিভি চ্যানেল ফ্রিতে দেখুন। স্পোর্টস, নিউজ, এন্টারটেইনমেন্ট ও আরও অনেক কিছু।">
<meta name="theme-color" content="#0a0a12">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>

<style>
:root{
  --bg:#050508;--bg2:#0a0a10;--bg3:#101018;--card:#0d0d16;--card-h:rgba(164,54,160,0.12);
  --primary:#a436a0;--primary-glow:rgba(164,54,160,0.4);--text:#ffffff;--text-m:#8a8a9e;--text-s:#5c5c6e;
  --accent:#36a49a;--font:'Outfit', sans-serif;--font-h:'Syne', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background-color:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden;user-select:none;}

/* Premium Header UI */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--bg2);border-bottom:1px solid rgba(255,255,255,0.03);position:sticky;top:0;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.h-left{display:flex;align-items:center;gap:12px;}
.logo-icon{background:linear-gradient(135deg, var(--primary), #632260);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--primary-glow);font-weight:800;font-size:18px;font-family:var(--font-h);}
.brand h1{font-size:20px;font-weight:800;font-family:var(--font-h);letter-spacing:-0.5px;background:linear-gradient(to right,#fff,var(--text-m));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.brand p{font-size:11px;color:var(--primary);font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-top:-2px;}
.h-right button{background:var(--bg3);border:1px solid rgba(255,255,255,0.05);color:var(--text);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;}
.h-right button:hover{background:var(--primary);border-color:var(--primary);box-shadow:0 0 15px var(--primary-glow);}

/* Main Layout Grid */
main{max-width:1400px;margin:0 auto;padding:20px;}

/* Marquee / Notice HUD */
.notice-bar{background:rgba(164,54,160,0.05);border:1px solid rgba(164,54,160,0.12);border-radius:12px;padding:10px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px;overflow:hidden;}
.notice-tag{background:var(--primary);color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:0.5px;font-family:var(--font-h);white-space:nowrap;}
.notice-bar marquee{color:var(--text-m);font-size:13.5px;font-weight:500;}

/* Category Switcher Tabs */
.tabs-wrap{overflow-x:auto;white-space:nowrap;margin-bottom:20px;padding-bottom:4px;scrollbar-width:none;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tabs-container{display:inline-flex;gap:8px;}
.tab{background:var(--bg2);border:1px solid rgba(255,255,255,0.04);color:var(--text-m);padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px;}
.tab:hover{color:#fff;background:rgba(255,255,255,0.02);}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px var(--primary-glow);}
.tab-count{background:rgba(0,0,0,0.25);font-size:11px;padding:1px 5px;border-radius:5px;opacity:0.8;}

/* Optimized Channel Cards Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:14px;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.03);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;position:relative;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);overflow:hidden;}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(600px circle at var(--x,0px) var(--y,0px), var(--card-h), transparent 40%);opacity:0;transition:opacity 0.25s;}
.card:hover::before{opacity:1;}
.card:hover{transform:translateY(-4px);border-color:rgba(164,54,160,0.25);box-shadow:0 10px 20px rgba(0,0,0,0.4);}
.img-wrap{width:70px;height:70px;border-radius:14px;background:var(--bg2);padding:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;border:1px solid rgba(255,255,255,0.02);box-shadow:inset 0 2px 6px rgba(0,0,0,0.5);position:relative;z-index:2;}
.img-wrap img{max-width:100%;max-height:100%;object-fit:contain;transition:transform 0.2s;}
.card:hover .img-wrap img{transform:scale(1.06);}
.c-name{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4;height:36px;position:relative;z-index:2;width:100%;}
.card-live{position:absolute;top:10px;right:10px;width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent);z-index:2;opacity:0.6;}

/* Native Fullscreen Video Container */
#player{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;opacity:0;transition:opacity 0.2s;}
#player.on{display:flex;opacity:1;}
#videoWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
video{width:100%;height:100%;object-fit:contain;background:#000;}

/* Pure HUD UI Controls Overlay */
.p-ui{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.7) 100%);display:flex;flex-direction:column;justify-content:space-between;opacity:0;pointer-events:none;transition:opacity 0.2s cubic-bezier(0.4,0,0.2,1);z-index:10;}
#player.show-ui .p-ui{opacity:1;pointer-events:auto;}

#player-top-bar{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;width:100%;}
.p-title-block{display:flex;align-items:center;gap:12px;max-width:70%;}
.p-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.04);color:#fff;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;}
.p-btn:hover{background:#fff;color:#000;}
.p-btn svg{width:18px;height:18px;fill:currentColor;}
#p-logo{width:32px;height:32px;object-fit:contain;background:var(--bg3);padding:4px;border-radius:6px;}
#p-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

#player-bottom-bar{padding:20px;display:flex;align-items:center;justify-content:center;gap:16px;width:100%;}
.p-ctrls{display:flex;align-items:center;gap:12px;}

/* Multi Server Pills Grid Map */
#p-servers{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:4px;scrollbar-width:none;}
#p-servers::-webkit-scrollbar{display:none;}
.server-pill{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);padding:5px 12px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--text-m);cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.server-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 0 10px var(--primary-glow);}

/* Native Buffering Spinners Ring */
#p-load{position:absolute;inset:0;background:rgba(0,0,0,0.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;backdrop-filter:blur(8px);}
#p-load.on{display:flex;}
.spinner{width:42px;height:42px;border:3px solid rgba(164,54,160,0.1);border-top-color:var(--primary);border-radius:50%;animation:spin 0.75s linear infinite;}
#p-load-text{font-size:14px;font-weight:600;color:var(--text-m);max-width:85%;text-align:center;}

/* Mini Snacker Notification Status Alert */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--primary);color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 10px 25px rgba(0,0,0,0.5);opacity:0;visibility:hidden;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);}
#toast.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}

@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:768px){
  header{padding:12px 16px;}
  .brand h1{font-size:18px;}
  main{padding:14px;}
  .grid{grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));gap:10px;}
  .card{padding:10px 6px;border-radius:10px;}
  .img-wrap{width:54px;height:54px;padding:6px;border-radius:10px;margin-bottom:6px;}
  .c-name{font-size:11.5px;height:32px;}
  #player-top-bar{padding:10px 14px;}
  #player-bottom-bar{padding:14px;flex-direction:column;gap:10px;}
  #p-name{font-size:13.5px;}
}
</style>
</head>
<body>

<header>
  <div class="h-left">
    <div class="logo-icon">M</div>
    <div class="brand">
      <h1 id="btn-refresh" style="cursor:pointer;">MN TV</h1>
      <p>Live Streaming</p>
    </div>
  </div>
  <div class="h-right">
    <button id="btn-sync">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      <span>রিলোড</span>
    </button>
  </div>
</header>

<main>
  <div class="notice-bar">
    <div class="notice-tag">বিজ্ঞপ্তি</div>
    <marquee id="notice-text">MN TV তে আপনাকে স্বাগতম! বিজ্ঞাপন মুক্ত প্রিমিয়াম লাইভ টিভি স্ট্রিমিং চ্যানেল উপভোগ করুন।</marquee>
  </div>

  <div class="tabs-wrap">
    <div class="tabs-container" id="category-container">
      <button class="tab active" id="tab-all">সব চ্যানেল <span class="tab-count" id="count-all">0</span></button>
    </div>
  </div>

  <div class="grid" id="channels-grid"></div>
</main>

<div id="player">
  <div id="videoWrap">
    <video id="video-player" playsinline></video>
    
    <div id="p-load">
      <div class="spinner"></div>
      <p id="p-load-text">চ্যানেল সংযোগ করা হচ্ছে...</p>
    </div>

    <div class="p-ui">
      <div id="player-top-bar">
        <div class="p-title-block">
          <button class="p-btn" id="p-back" title="বন্ধ করুন">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </button>
          <img id="p-logo" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" alt="logo">
          <span id="p-name">লোড হচ্ছে...</span>
        </div>
        <button class="p-btn" id="p-fs" title="ফুলস্ক্রিন">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>

      <div id="player-bottom-bar">
        <div id="p-servers"></div>
        <div class="p-ctrls">
          <button class="p-btn" id="p-prev" title="আগের চ্যানেল">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="p-btn" id="p-reload" title="পুনরায় চেষ্টা করুন">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
          <button class="p-btn" id="p-next" title="পরের চ্যানেল">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast">বিজ্ঞপ্তি বার্তা</div>

<script src="script.js" defer></script>

<script>
const uiBridgeInterval = setInterval(() => {
    if (window.CHANNELS && window.CHANNELS.length > 0) {
        clearInterval(uiBridgeInterval);
        mapChannelsDataToMNLayout();
    }
}, 100);

function mapChannelsDataToMNLayout() {
    const catContainer = document.getElementById('category-container');
    if(!window.CHANNELS || window.CHANNELS.length === 0) return;
    
    document.getElementById('count-all').innerText = window.CHANNELS.length;
    
    let categories = new Set();
    window.CHANNELS.forEach(ch => { if(ch.category) categories.add(ch.category); });
    
    catContainer.innerHTML = `<button class="tab active" id="tab-all" onclick="bridgeFilterCategory('all')">সব চ্যানেল <span class="tab-count">${window.CHANNELS.length}</span></button>`;
    categories.forEach(cat => {
        const count = window.CHANNELS.filter(c => c.category === cat).length;
        catContainer.innerHTML += `<button class="tab" id="tab-${cat.replace(/\s+/g, '-')}" onclick="bridgeFilterCategory('${cat}')">${cat} <span class="tab-count">${count}</span></button>`;
    });

    renderMNGrid(window.CHANNELS);
}

function renderMNGrid(list) {
    const grid = document.getElementById('channels-grid');
    grid.innerHTML = "";
    
    list.forEach((ch) => {
        const realIndex = window.CHANNELS.findIndex(c => c.name === ch.name && c.url === ch.url);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-live"></div>
            <div class="img-wrap">
                <img src="${ch.logo || ch.poster}" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%235c5c6e\'><path d=\'M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z\'/></svg>'">
            </div>
            <div class="c-name">${ch.name}</div>
        `;
        
        card.addEventListener('mousemove', e => {
            const rect = card.getBoundingClientRect();
            card.style.setProperty('--x', `${e.clientX - rect.left}px`);
            card.style.setProperty('--y', `${e.clientY - rect.top}px`);
        });
        
        card.onclick = () => {
            if(typeof window.playChannel === 'function') {
                window.playChannel(realIndex);
                syncPlayerHUDUIState(ch);
            }
        };
        grid.appendChild(card);
    });
}

function bridgeFilterCategory(cat) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if(cat === 'all') {
        document.getElementById('tab-all').classList.add('active');
        renderMNGrid(window.CHANNELS);
    } else {
        const selectedTab = document.getElementById(`tab-${cat.replace(/\s+/g, '-')}`);
        if(selectedTab) selectedTab.classList.add('active');
        renderMNGrid(window.CHANNELS.filter(c => c.category === cat));
    }
}

function syncPlayerHUDUIState(ch) {
    const player = document.getElementById('player');
    const srvBox = document.getElementById('p-servers');
    
    document.getElementById('p-name').innerText = ch.name;
    document.getElementById('p-logo').src = ch.logo || ch.poster;
    player.classList.add('on');
    document.body.style.overflow = 'hidden';
    
    srvBox.innerHTML = "";
    if(ch.servers && ch.servers.length > 0) {
        ch.servers.forEach((srv, sIdx) => {
            srvBox.innerHTML += `<div class="server-pill ${sIdx === window.currentServerIndex ? 'active' : ''}" onclick="bridgeServerChange(${sIdx})">${srv.label}</div>`;
        });
    } else {
        srvBox.innerHTML = `<div class="server-pill active">প্রধান সার্ভার</div>`;
    }
    triggerPlayerUIHUD();
}

function bridgeServerChange(idx) {
    if(typeof window.changeServer === 'function') {
        window.changeServer(idx);
        document.querySelectorAll('.server-pill').forEach((p, sIdx) => {
            p.classList.toggle('active', sIdx === idx);
        });
    }
}

function triggerPlayerUIHUD() {
    const player = document.getElementById('player');
    player.classList.add('show-ui');
    clearTimeout(window.hudTimer);
    window.hudTimer = setTimeout(() => {
        if(!document.getElementById('video-player').paused) player.classList.remove('show-ui');
    }, 4000);
}

function closePlayer() {
    document.getElementById('player').className = "";
    document.body.style.overflow = "";
    if(typeof window.destroyPlayer === 'function') window.destroyPlayer();
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

document.getElementById('p-back').onclick = closePlayer;
document.getElementById('btn-sync').onclick = () => { location.reload(); };

// Safe Mutation Layer Stream States Loader Switchers observer
const observer = new MutationObserver(() => {
    const mnLoader = document.getElementById('p-load');
    const nativeVid = document.getElementById('video-player');
    if(nativeVid && (nativeVid.seeking || nativeVid.readyState < 3)) {
        if(player.classList.contains('on')) mnLoader.classList.add('on');
    } else {
        mnLoader.classList.remove('on');
    }
});
observer.observe(document.body, { attributes: true, subtree: true, childList: true });

function toast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.classList.add('on');
    clearTimeout(t.timer); t.timer = setTimeout(() => t.classList.remove('on'), 3000);
}
</script>
</body>
</html>
