<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>MN TV — Watch Free Live TV Channels Online</title>
<meta name="description" content="MN TV — বাংলাদেশ, ভারত ও আন্তর্জাতিক লাইভ টিভি চ্যানেল ফ্রিতে দেখুন। স্পোর্টস, নিউজ, এন্টারটেইনমেন্ট ও আরও অনেক কিছু।">
<meta name="theme-color" content="#0a0a12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
<style>
:root{
  --bg:#050508;--bg2:#0a0a10;--bg3:#101018;--card:#0d0d16;--card-h:rgba(164,54,160,0.12);
  --primary:#a436a0;--primary-glow:rgba(164,54,160,0.4);--text:#ffffff;--text-m:#8a8a9e;--text-s:#5c5c6e;
  --accent:#36a49a;--font:'Outfit', sans-serif;--font-h:'Syne', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background-color:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden;user-select:none;}
.hide{display:none !important;}

/* Header */
header{display:flex;align-items:center;justify-content:between;padding:18px 24px;background:var(--bg2);border-bottom:1px solid rgba(255,255,255,0.03);position:sticky;top:0;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.h-left{display:flex;align-items:center;gap:12px;}
.logo-icon{background:linear-gradient(135deg, var(--primary), #632260);width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--primary-glow);font-weight:800;font-size:20px;font-family:var(--font-h);}
.brand h1{font-size:22px;font-weight:800;font-family:var(--font-h);letter-spacing:-0.5px;background:linear-gradient(to right,#fff,var(--text-m));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.brand p{font-size:12px;color:var(--primary);font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-top:-2px;}
.h-right button{background:var(--bg3);border:1px solid rgba(255,255,255,0.05);color:var(--text);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 0.2s;}
.h-right button:hover{background:var(--primary);border-color:var(--primary);box-shadow:0 0 15px var(--primary-glow);}

/* Main Container */
main{max-width:1400px;margin:0 auto;padding:24px;}

/* Marquee / Notice */
.notice-bar{background:rgba(164,54,160,0.06);border:1px solid rgba(164,54,160,0.15);border-radius:14px;padding:12px 18px;margin-bottom:24px;display:flex;align-items:center;gap:12px;overflow:hidden;}
.notice-tag{background:var(--primary);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:0.5px;font-family:var(--font-h);white-space:nowrap;}
.notice-bar marquee{color:var(--text-m);font-size:14px;font-weight:500;}

/* Category Tabs */
.tabs-wrap{overflow-x:auto;white-space:nowrap;margin-bottom:24px;padding-bottom:4px;scrollbar-width:none;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tabs-container{display:inline-flex;gap:10px;}
.tab{background:var(--bg2);border:1px solid rgba(255,255,255,0.04);color:var(--text-m);padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:8px;}
.tab:hover{color:#fff;background:rgba(255,255,255,0.03);}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 5px 15px var(--primary-glow);}
.tab-count{background:rgba(0,0,0,0.2);font-size:11px;padding:2px 6px;border-radius:6px;opacity:0.8;}

/* Grid System */
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:16px;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.03);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;position:relative;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);overflow:hidden;}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(800px circle at var(--x,0px) var(--y,0px), var(--card-h), transparent 40%);opacity:0;transition:opacity 0.3s;}
.card:hover::before{opacity:1;}
.card:hover{transform:translateY(-5px);border-color:rgba(164,54,160,0.3);box-shadow:0 12px 24px rgba(0,0,0,0.4);}
.img-wrap{width:76px;height:76px;border-radius:18px;background:var(--bg2);padding:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;border:1px solid rgba(255,255,255,0.02);box-shadow:inset 0 2px 8px rgba(0,0,0,0.6);position:relative;z-index:2;}
.img-wrap img{max-width:100%;max-height:100%;object-fit:contain;transition:transform 0.3s;}
.card:hover .img-wrap img{transform:scale(1.08);}
.c-name{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4;height:39px;position:relative;z-index:2;width:100%;}
.card-live{position:absolute;top:10px;right:10px;width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent);z-index:2;opacity:0.7;}

/* Video Player Layer */
#player{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;opacity:0;transition:opacity 0.3s;}
#player.on{display:flex;opacity:1;}
#videoWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
video{width:100%;height:100%;object-contain:contain;background:#000;}

/* Player Overlay UI */
.p-ui{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.8) 100%);display:flex;flex-direction:column;justify-content:between;opacity:0;pointer-events:none;transition:opacity 0.3s cubic-bezier(0.4,0,0.2,1);z-index:10;}
#player.show-ui .p-ui{opacity:1;pointer-events:auto;}

/* Player Bars */
#player-top-bar{padding:16px 24px;display:flex;align-items:center;justify-content:between;width:100%;}
.p-title-block{display:flex;align-items:center;gap:14px;max-width:70%;}
.p-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.05);color:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;}
.p-btn:hover{background:#fff;color:#000;}
.p-btn svg{width:20px;height:20px;fill:currentColor;}
#p-logo{width:36px;height:36px;object-fit:contain;background:var(--bg3);padding:4px;border-radius:8px;}
#p-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

#player-bottom-bar{padding:24px;display:flex;align-items:center;justify-content:center;gap:20px;width:100%;}
.p-ctrls{display:flex;align-items:center;gap:14px;}

/* Server Pill */
#p-servers{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:4px;scrollbar-width:none;}
#p-servers::-webkit-scrollbar{display:none;}
.server-pill{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.05);padding:6px 14px;border-radius:9px;font-size:12px;font-weight:600;color:var(--text-m);cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.server-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 0 10px var(--primary-glow);}

/* Native Buffering Spinner */
#p-load{position:absolute;inset:0;background:rgba(0,0,0,0.75);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;backdrop-blur:10px;}
#p-load.on{display:flex;}
.spinner{width:46px;height:46px;border:3.5px solid rgba(164,54,160,0.1);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;}
#p-load-text{font-size:15px;font-weight:600;color:var(--text-m);max-width:80%;text-align:center;}

/* Toast Notice */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--primary);color:#fff;padding:12px 24px;border-radius:14px;font-size:14px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,0.5);opacity:0;visibility:hidden;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);}
#toast.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}

/* Animations */
@keyframes spin{to{transform:rotate(360deg);}}

/* Responsiveness */
@media(max-width:768px){
  header{padding:14px 16px;}
  .brand h1{font-size:19px;}
  main{padding:16px;}
  .grid{grid-template-columns:repeat(auto-fill, minmax(105px, 1fr));gap:10px;}
  .card{padding:12px 8px;border-radius:12px;}
  .img-wrap{width:56px;height:56px;padding:6px;border-radius:12px;margin-bottom:8px;}
  .c-name{font-size:12px;height:34px;}
  #player-top-bar{padding:12px 16px;}
  #player-bottom-bar{padding:16px;flex-direction:column;gap:12px;}
  #p-name{font-size:14px;}
}
</style>
</head>
<body>

<header>
  <div class="h-left">
    <div class="logo-icon">M</div>
    <div class="brand">
      <h1 id="btn-refresh" style="cursor:pointer;">MN TV</h1>
      <p>Live Streaming</p>
    </div>
  </div>
  <div class="h-right">
    <button id="btn-sync">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      <span>রিলোড</span>
    </button>
  </div>
</header>

<main>
  <div class="notice-bar">
    <div class="notice-tag">বিজ্ঞপ্তি</div>
    <marquee id="notice-text">লোডিং হচ্ছে... দয়া করে অপেক্ষা করুন।</marquee>
  </div>

  <div class="tabs-wrap">
    <div class="tabs-container" id="category-container">
      <button class="tab active" onclick="filterCategory('all')">সব চ্যানেল <span class="tab-count" id="count-all">0</span></button>
    </div>
  </div>

  <div class="grid" id="channels-grid"></div>
</main>

<div id="player">
  <div id="videoWrap">
    <video id="video-player" playsinline></video>
    
    <div id="p-load">
      <div class="spinner"></div>
      <p id="p-load-text">চ্যানেল সংযোগ করা হচ্ছে...</p>
    </div>

    <div class="p-ui">
      <div id="player-top-bar">
        <div class="p-title-block">
          <button class="p-btn" id="p-back" title="বন্ধ করুন">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </button>
          <img id="p-logo" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" alt="logo">
          <span id="p-name">Loading...</span>
        </div>
        <button class="p-btn" id="p-fs" title="ফুলস্ক্রিন">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>

      <div id="player-bottom-bar">
        <div id="p-servers"></div>
        <div class="p-ctrls">
          <button class="p-btn" id="p-prev" title="আগের চ্যানেল">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="p-btn" id="p-reload" title="পুনরায় চেষ্টা করুন">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
          <button class="p-btn" id="p-next" title="পরের চ্যানেল">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast">বিজ্ঞপ্তি বার্তা</div>

<script>
// ==========================================
// CONFIGURATION ENGINE (M3U & PROXY SOURCES)
// ==========================================
const WORKER_URL = 'https://playlist.emonsa4.workers.dev/playlist.m3u';
const CORS_PROXY = 'https://iptvtest068.emonsa4.workers.dev/?';

let CHANNELS = [];
let FILTERED_CHANNELS = [];
let curIdx = -1;
let curSrv = 0;
let hlsInstance = null;
let uiTimer = null;

// DOM Selectors
const $ = id => document.getElementById(id);
const grid = $('channels-grid');
const player = $('player');
const video = $('video-player');
const pLoad = $('p-load');
const pLoadText = $('p-load-text');

// ==========================================
// APPLICATION INITIALIZATION & CORE PARSER
// ==========================================
window.addEventListener('DOMContentLoaded', () => {
    fetchPlaylist();
    fetchSettings();
    
    // Global Event Controls
    $('btn-sync').onclick = () => { toast('প্লেলিস্ট আপডেট করা হচ্ছে...'); fetchPlaylist(); };
    $('p-back').onclick = closePlayer;
    $('p-reload').onclick = () => { if(curIdx >= 0) loadServerStream(curSrv); };
    $('p-prev').onclick = () => { if(curIdx > 0) playChannelByIndex(curIdx - 1); };
    $('p-next').onclick = () => { if(curIdx < FILTERED_CHANNELS.length - 1) playChannelByIndex(curIdx + 1); };
    
    $('p-fs').onclick = () => {
        if (!document.fullscreenElement) {
            ($('videoWrap').requestFullscreen || $('videoWrap').webkitRequestFullscreen)?.call($('videoWrap'));
        } else {
            (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
        }
    };

    // UI Interactive Event HUD listeners
    player.addEventListener('mousemove', triggerPlayerUIHUD);
    player.addEventListener('click', (e) => {
        if (!e.target.closest('button') && !e.target.closest('#p-servers')) triggerPlayerUIHUD();
    });
});

// Fetch configuration metadata notice text
async function fetchSettings() {
    try {
        const res = await fetch(`https://playlist.emonsa4.workers.dev/settings?t=${Date.now()}`);
        if(res.ok) {
            const settings = await res.json();
            if(settings && settings.notice) $('notice-text').innerText = settings.notice;
        }
    } catch(e) {
        $('notice-text').innerText = "MN TV তে আপনাকে স্বাগতম! যেকোনো ইন্টারনেটেই বাফারিং ছাড়া স্মুথলি লাইভ টিভি উপভোগ করুন।";
    }
}

// Master M3U Extractor Logic
async function fetchPlaylist() {
    try {
        const targetUrl = CORS_PROXY + encodeURIComponent(WORKER_URL);
        const res = await fetch(targetUrl);
        if(!res.ok) throw new Error("Could not parse from remote endpoint source");
        const data = await res.text();
        
        parseM3UContent(data);
    } catch (e) {
        console.error(e);
        toast("চ্যানেল ডাটা লোড করতে ব্যর্থ হয়েছে!");
    }
}

function parseM3UContent(text) {
    const lines = text.split('\n');
    CHANNELS = [];
    let currentItem = null;
    let categoriesSet = new Set();

    for(let i=0; i<lines.length; i++) {
        let line = lines[i].trim();
        if(line.startsWith('#EXTINF:')) {
            currentItem = {};
            // Parse attributes
            const groupMatch = line.match(/group-title="([^"]+)"/i);
            const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
            const nameMatch = line.match(/,(.+)$/);
            
            currentItem.category = groupMatch ? groupMatch[1] : "অন্যান্য";
            currentItem.logo = logoMatch ? logoMatch[1] : "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>";
            currentItem.name = nameMatch ? nameMatch[1].trim() : "অজানা চ্যানেল";
            categoriesSet.add(currentItem.category);
        } else if(line.startsWith('http') && currentItem) {
            // প্রতিটি সোর্সকে সার্ভার ফরম্যাটে সাজানো হচ্ছে
            currentItem.servers = [{ label: "সার্ভার ১", url: line }];
            CHANNELS.push(currentItem);
            currentItem = null;
        }
    }
    
    FILTERED_CHANNELS = [...CHANNELS];
    generateCategoryTabs(categoriesSet);
    renderGridSystem(FILTERED_CHANNELS);
}

// ==========================================
// RENDER COMPONENT UI INTERFACES
// ==========================================
function generateCategoryTabs(categories) {
    const container = $('category-container');
    container.innerHTML = `<button class="tab active" id="tab-all" onclick="filterCategory('all')">সব চ্যানেল <span class="tab-count">${CHANNELS.length}</span></button>`;
    
    // Sort logic categories count append
    categories.forEach(cat => {
        const count = CHANNELS.filter(c => c.category === cat).length;
        container.innerHTML += `<button class="tab" id="tab-${cat.replace(/\s+/g, '-')}" onclick="filterCategory('${cat}')">${cat} <span class="tab-count">${count}</span></button>`;
    });
}

function filterCategory(cat) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if(cat === 'all') {
        $('tab-all').classList.add('active');
        FILTERED_CHANNELS = [...CHANNELS];
    } else {
        $(`tab-${cat.replace(/\s+/g, '-')}`).classList.add('active');
        FILTERED_CHANNELS = CHANNELS.filter(c => c.category === cat);
    }
    renderGridSystem(FILTERED_CHANNELS);
}

function renderGridSystem(list) {
    grid.innerHTML = "";
    if(list.length === 0) {
        grid.innerHTML = `<p style='grid-column:1/-1; text-align:center; color:var(--text-s); padding:40px;'>কোনো চ্যানেল পাওয়া যায়নি</p>`;
        return;
    }
    
    list.forEach((ch, idx) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
            <div class="card-live"></div>
            <div class="img-wrap">
                <img src="${ch.logo}" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%235c5c6e\'><path d=\'M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z\'/></svg>'">
            </div>
            <div class="c-name">${ch.name}</div>
        `;
        
        // Mouse move light effect logic card mouse listeners
        el.addEventListener('mousemove', e => {
            const rect = el.getBoundingClientRect();
            el.style.setProperty('--x', `${e.clientX - rect.left}px`);
            el.style.setProperty('--y', `${e.clientY - rect.top}px`);
        });
        
        el.onclick = () => playChannelByIndex(idx);
        grid.appendChild(el);
    });
}

// ==========================================
// STREAM ENGINE PLAYBACK PLAYER
// ==========================================
function playChannelByIndex(idx) {
    if(idx < 0 || idx >= FILTERED_CHANNELS.length) return;
    curIdx = idx;
    curSrv = 0;
    
    const ch = FILTERED_CHANNELS[idx];
    $('p-name').innerText = ch.name;
    $('p-logo').src = ch.logo;
    
    // Generate Server Buttons pills dynamically
    const srvBox = $('p-servers');
    srvBox.innerHTML = "";
    ch.servers.forEach((srv, sIdx) => {
        srvBox.innerHTML += `<div class="server-pill ${sIdx===0?'active':''}" onclick="changeServerSource(${sIdx})">${srv.label}</div>`;
    });
    
    player.classList.add('on');
    document.body.style.overflow = 'hidden';
    triggerPlayerUIHUD();
    
    loadServerStream(curSrv);
}

function changeServerSource(srvIndex) {
    curSrv = srvIndex;
    document.querySelectorAll('.server-pill').forEach((p, idx) => {
        p.classList.toggle('active', idx === srvIndex);
    });
    toast(`সার্ভার পরিবর্তন করা হচ্ছে...`);
    loadServerStream(srvIndex);
}

// High Optimization Buffer Loader Routine Engine 
function loadServerStream(srvIdx) {
    destroyPlayerInstance();
    showBufferingState(true, "চ্যানেল প্রসেস করা হচ্ছে, দয়া করে অপেক্ষা করুন...");
    
    const rawUrl = FILTERED_CHANNELS[curIdx].servers[srvIdx].url;
    // BTV bypass logic proxies natively
    const isBtv = FILTERED_CHANNELS[curIdx].name.toLowerCase().includes("btv");
    const proxiedStreamUrl = isBtv ? rawUrl : (CORS_PROXY + encodeURIComponent(rawUrl));

    if (Hls.isSupported()) {
        hlsInstance = new Hls({
            // Ultra Optimization Variables for Slow/Bad connection stability
            enableWorker: true,
            maxBufferLength: 60,          // 60 সেকেন্ডের বাফার আগাম রেন্ডার হবে যাতে কাপাকাপি না করে
            maxMaxBufferLength: 120,
            maxBufferSize: 60 * 1000 * 1000, 
            liveSyncDurationCount: 4,      // delay standard maintainer
            liveMaxLatencyDurationCount: 10,
            appendErrorMaxRetry: 5,
            liveDurationInfinity: true,
            lowLatencyMode: false          // Low Network এ স্ট্যাবিলিটি বাড়ানোর জন্য ফলস রাখা হয়েছে
        });
        
        hlsInstance.loadSource(proxiedStreamUrl);
        hlsInstance.attachMedia(video);
        
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {
                video.muted = true; // Block code autoplay standard browser
                video.play();
            });
        });
        
        // HLS Auto Error recovery pipeline logic for network loss dropouts
        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        showBufferingState(true, "নেটওয়ার্ক ডাউন! অটো রিকভারি চলছে...");
                        hlsInstance.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        showBufferingState(true, "মিডিয়া বাফারিং রিকভারি চলছে...");
                        hlsInstance.recoverMediaError();
                        break;
                    default:
                        showBufferingState(true, "সার্ভার রেসপন্স করছে না। পুনরায় লোড করুন।");
                        destroyPlayerInstance();
                        break;
                }
            }
        });
        
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native support systems for Apple devices iOS/Safari
        video.src = proxiedStreamUrl;
        video.addEventListener('loadedmetadata', () => {
            video.play();
        });
    } else {
        showBufferingState(true, "আপনার ব্রাউজারে এই ভিডিওটি সাপোর্টেড নয়!");
    }
}

// Video Tag Active Handlers
video.onwaiting = () => showBufferingState(true, "বাফারিং হচ্ছে... একটু অপেক্ষা করুন");
video.onplaying = () => showBufferingState(false);
video.onstalled = () => showBufferingState(true, "দুর্বল ইন্টারনেটের কারণে স্ট্রিম স্লো হচ্ছে...");

function showBufferingState(show, text = "") {
    if(show) {
        if(text) pLoadText.innerText = text;
        pLoad.classList.add('on');
    } else {
        pLoad.classList.remove('on');
    }
}

function triggerPlayerUIHUD() {
    player.classList.add('show-ui');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => {
        if(!video.paused) player.classList.remove('show-ui');
    }, 4500); // UI auto hides after 4.5 seconds if video runs fine
}

function closePlayer() {
    clearTimeout(uiTimer);
    player.className = "";
    document.body.style.overflow = "";
    destroyPlayerInstance();
    showBufferingState(false);
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

function destroyPlayerInstance() {
    video.pause();
    video.removeAttribute('src');
    video.load();
    if(hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
    }
}

// Toast Notifier
function toast(msg) {
    const t = $('toast');
    t.innerText = msg;
    t.classList.add('on');
    clearTimeout(t.timer);
    t.timer = setTimeout(() => t.classList.remove('on'), 3000);
}
</script>
